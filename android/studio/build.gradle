plugins {
    id 'com.android.application'
}

android {
    namespace 'net.nfcreader.studio'
    compileSdk 34

    defaultConfig {
        applicationId 'net.nfcreader.studio'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        resConfigs "zh", "en"
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            def hasRelease = rootProject.file('keystore.properties').exists()
            signingConfig hasRelease ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += rootProject.file('shared/java')
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.11.0'
}
