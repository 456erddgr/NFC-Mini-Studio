plugins {
    id 'com.android.application'
}

// 正式签名证书：android/keystore.properties + android/keystore/nfcmini-release.jks
// 说明：这是一个「公开的演示签名证书」，密码就写在仓库里，任何人克隆后都能重新构建出
// 与 GitHub Releases 上完全一致的签名包（方便增量覆盖安装）。如果你想以自己名义发布，
// 请用 keytool 生成你自己的证书并替换这两个文件。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists() && keystoreProps['storeFile'] != null

android {
    namespace 'net.nfcreader.minireader'
    compileSdk 34

    defaultConfig {
        applicationId "net.nfcreader.minireader"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        // 中文界面
        resConfigs "zh", "en"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 有正式证书就用正式证书，没有则退回 debug 签名（保证总能装）
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
